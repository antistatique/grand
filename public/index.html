<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le GRAND - Prix Romand de la Création 2025 : 17 juin 2025</title>
    <meta name="description" content="Le GRAND revient le 17 juin 2025 à Lausanne. Ouvrez les inscriptions le 1er avril 2025. Suivez-nous sur Instagram pour toutes les infos.">

    <link rel="manifest" href="/favicon/manifest.json" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="/favicon/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="/favicon/browserconfig.xml" />

    <meta name="theme-color" content="#ffffff" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            text-align: center;
        }

        .container {
            padding: 10px;
            max-width: 800px;
        }

        .logo {
            max-width: 400px;
            height: auto;
            margin-bottom: 40px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .date {
            font-size: 18px;
            margin-bottom: 40px;
            color: #666;
        }

        .social-text {
            font-size: 16px;
            margin-bottom: 15px;
            color: #666;
        }

        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #000;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #333;
        }
    </style>
    <script>
        // Unregister existing service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <img src="images/logo_association_grand.png" alt="Le GRAND Logo" class="logo">
        
        <h1 class="title">Le GRAND revient le 17 juin 2025 à Lausanne</h1>
        
        <p class="date">Ouverture des inscriptions: 1er avril 2025</p>
        
        <p class="social-text">Retrouvez toutes les infos sur insta !</p>
        
        <a href="https://www.instagram.com/associationgrand/" class="button" target="_blank">
            Suivez-nous
        </a>
    </div>
</body>
</html>
